[project]
name = "agent-trust"
version = "0.1.0"
description = "Signed MCP authorization policies with a stdio and Streamable HTTP enforcement relay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44",
    "mcp>=1.21,<2",
    "starlette>=0.46",
    "uvicorn>=0.30",
]

[project.scripts]
agent-trust-demo = "agent_trust.examples.demo:main"
agent-trust-generate = "agent_trust.cli.generate:main"
agent-trust-mint-jwt = "agent_trust.cli.mint_jwt:main"
agent-trust-relay = "agent_trust.mcp.relay:main"
demo-support-mcp = "demo_support_mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_trust*", "demo_support_mcp*"]
